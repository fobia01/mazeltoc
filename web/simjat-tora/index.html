<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mazeltoc — Edición Simjat Torá</title>
<meta name="description" content="Juegos por equipos para festejar Simjat Torá: trivia, Guerra de Canciones, Dígalo con Mímica, hakafot y más.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E3A8A">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mazeltoc ST">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<!-- sonidos grabados -->
<audio id="audio-aplauso" preload="auto" src="audio/applause.mp3"></audio>
<audio id="audio-abucheo" preload="auto" src="audio/boo.mp3"></audio>
<audio id="audio-tictac" preload="auto" src="audio/clock-tick.mp3"></audio>
<audio id="audio-chicharra" preload="auto" src="audio/buzzer.mp3"></audio>
<audio id="audio-hinchada" preload="auto" src="audio/crowd-cheer-big.mp3"></audio>
<audio id="audio-abucheo-grande" preload="auto" src="audio/crowd-boo-big.mp3"></audio>

<div class="fondo-banderitas" id="fondoBanderitas" aria-hidden="true"></div>

<header class="encabezado">
  <div class="logos">
    <img src="images/logo-bet-am.jpg" alt="Logo Bet Am del Oeste">
    <img src="images/logo-templo-tiferet.jpg" alt="Logo Templo Tiferet Israel">
  </div>
  <h1 class="titulo-app" onclick="pantallaMenu()" title="Ir al menú de juegos">
    <span class="tora">📜</span> Mazeltoc <span class="tora" style="animation-delay:-.8s">🚩</span>
    <span class="edicion">Edición Simjat Torá</span>
  </h1>
  <div class="guirnalda" aria-hidden="true"><span>💃</span><span>📜</span><span>🎶</span><span>🚩</span><span>🕺</span></div>
</header>

<main id="app" class="app"></main>

<footer class="pie">Un desarrollo de Fabio Schvartz para Kabbanames — todos los derechos reservados 2026</footer>

<!-- librería de confeti (copia local, funciona sin internet) -->
<script src="js/vendor/confetti.min.js"></script>

<!-- configuración: tiempos y puntajes -->
<script src="js/config.js"></script>

<!-- bancos de preguntas y palabras (se pueden editar) -->
<script src="datos/trivia.js"></script>
<script src="datos/verdadero-falso.js"></script>
<script src="datos/canciones.js"></script>
<script src="datos/palabra-prohibida.js"></script>
<script src="datos/mimica.js"></script>
<script src="datos/quien-soy.js"></script>
<script src="datos/ordenar.js"></script>
<script src="datos/emojis.js"></script>
<script src="datos/ahorcado.js"></script>
<script src="datos/memoria.js"></script>

<!-- el programa -->
<script src="js/sonidos.js"></script>
<script src="js/nucleo.js"></script>
<script src="js/juegos.js"></script>
<script>
  // banderitas y Torás flotando en el fondo
  (function () {
    const cont = document.getElementById('fondoBanderitas');
    const emojis = ['🚩', '📜', '🚩', '✡️', '🍎', '🚩', '🎶', '🚩', '⭐', '📜'];
    emojis.forEach((e, i) => {
      const s = document.createElement('span');
      s.textContent = e;
      s.style.left = (i * 10 + Math.random() * 6) + '%';
      s.style.animationDuration = (16 + Math.random() * 14) + 's';
      s.style.animationDelay = (-Math.random() * 25) + 's';
      cont.appendChild(s);
    });
  })();

  Estado.cargar();
  pantallaMenu();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
